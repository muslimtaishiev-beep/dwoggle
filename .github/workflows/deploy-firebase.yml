# Deploy Bekem to Google: backend → Cloud Run, frontend → Firebase Hosting (same address).
# Run it from GitHub: Actions → "Deploy to Firebase" → Run workflow.
# One-time setup: deploy/firebase/DEPLOY_FIREBASE.md.
name: Deploy to Firebase

on:
  workflow_dispatch:

env:
  PROJECT: bekem-514710
  REGION: europe-west1

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # lets GitHub prove to Google that this run comes from our repo (no key needed)
    steps:
      - uses: actions/checkout@v4

      # Keyless sign-in (Workload Identity Federation), set up by deploy/firebase/setup_gcp.sh.
      # These are identifiers, not secrets: Google only accepts tokens from muslimtaishiev-beep/dwoggle.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/848548003400/locations/global/workloadIdentityPools/github/providers/dwoggle
          service_account: bekem-deployer@bekem-514710.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      # Backend settings. Written as JSON (valid YAML), so passwords with any characters survive.
      # The file stays on this runner; it is not part of the uploaded source.
      - name: Backend settings
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python3 -c '
          import json, os
          json.dump({
              "BEKEM_PROVIDER": "earthengine",
              "BEKEM_EE_PROJECT": os.environ["PROJECT"],
              "BEKEM_FIREBASE_PROJECT": os.environ["PROJECT"],
              "BEKEM_EARTHDATA_USERNAME": os.environ.get("EARTHDATA_USERNAME", ""),
              "BEKEM_EARTHDATA_PASSWORD": os.environ.get("EARTHDATA_PASSWORD", ""),
          }, open("cloudrun-env.yaml", "w"))
          '

      # Builds backend/Dockerfile with Cloud Build and runs it as bekem-api (no key file inside).
      - name: Backend → Cloud Run
        run: |
          gcloud run deploy bekem-api \
            --source backend \
            --project "$PROJECT" --region "$REGION" \
            --service-account "bekem-api@$PROJECT.iam.gserviceaccount.com" \
            --allow-unauthenticated \
            --memory 1Gi --cpu 1 --cpu-boost \
            --min-instances 0 --max-instances 3 --timeout 60 \
            --env-vars-file cloudrun-env.yaml \
            --quiet

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend → Firebase Hosting
        run: npx --yes firebase-tools@latest deploy --only hosting --project "$PROJECT" --non-interactive

      - name: Is it alive?
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "https://$PROJECT.web.app/api/health"; then exit 0; fi
            sleep 10
          done
          exit 1
