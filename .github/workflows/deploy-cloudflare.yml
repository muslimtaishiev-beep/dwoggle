# Deploy Bekem (frontend + backend container) to Cloudflare.
# Run it from GitHub: Actions → "Deploy to Cloudflare" → Run workflow.
# One-time setup is in deploy/cloudflare/DEPLOY_CLOUDFLARE.md.
name: Deploy to Cloudflare

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      # wrangler builds backend/Dockerfile with the runner's Docker and pushes it to Cloudflare.
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
